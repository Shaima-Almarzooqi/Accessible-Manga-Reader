name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Supplies the GTK libraries WeasyPrint needs for tagged PDF
      # export. PyInstaller's weasyprint hook collects them into the
      # build. Allowed to fail: without GTK the app simply falls back
      # to the simpler PDF export, so a build is still usable.
      - name: Install GTK runtime
        continue-on-error: true
        run: choco install -y gtk-runtime --no-progress

      # PyInstaller's weasyprint hook finds the GTK libraries with
      # ctypes.util.find_library, which searches PATH. Chocolatey does
      # not reliably put GTK's bin directory there, so locate it and add
      # it explicitly. Also reports what was found, so a build that ends
      # up without tagged PDF says why.
      - name: Put GTK on PATH
        continue-on-error: true
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path 'C:\Program Files','C:\Program Files (x86)','C:\tools' `
            -Filter 'libgobject-2.0-0.dll' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($found) {
            $bin = $found.Directory.FullName
            Write-Host "GTK libraries found in $bin"
            Add-Content -Path $env:GITHUB_PATH -Value $bin
            Get-ChildItem $bin -Filter 'lib*-*.dll' | Select-Object -First 12 |
              ForEach-Object { Write-Host "  $($_.Name)" }
            $fonts = Join-Path (Split-Path $bin -Parent) 'etc\fonts'
            Write-Host "fontconfig config present: $(Test-Path $fonts) ($fonts)"
          } else {
            Write-Host 'GTK libraries NOT found - PDF export will fall back.'
          }

      - name: Check WeasyPrint can load
        continue-on-error: true
        run: python -c "import weasyprint; print('WeasyPrint loaded OK', weasyprint.__version__)"

      - name: Run tests
        run: python run_tests.py

      # Two builds from the same source.
      #   onefile: the familiar single .exe. It unpacks the whole bundle
      #            to a temp folder on every launch, which is why it is
      #            slow to start; kept because many people prefer one file.
      #   onedir:  a folder, zipped. Nothing is unpacked at launch, so it
      #            starts fast, and it avoids the self-extracting pattern
      #            that antivirus heuristics dislike.
      # --noupx: never UPX-compress. UPX slows startup and is a strong
      #          antivirus red flag.
      # --exclude-module tkinter: the app is wxPython only and never
      #          imports tkinter; PyInstaller would otherwise bundle it as
      #          dead weight. The interface is unaffected.
      - name: Build single executable
        run: >
          pyinstaller --onefile --windowed --clean --noupx
          --exclude-module tkinter
          --name AccessibleMangaReader-${{ matrix.arch }}
          main.py

      # Same name as the exe, built to a separate path so the two do
      # not collide, then zipped to AccessibleMangaReader-<arch>.zip.
      - name: Build folder version
        run: >
          pyinstaller --onedir --windowed --clean --noupx
          --exclude-module tkinter
          --distpath dist-folder --workpath build-folder
          --name AccessibleMangaReader-${{ matrix.arch }}
          main.py

      - name: Zip folder version
        shell: pwsh
        run: >
          Compress-Archive
          -Path "dist-folder/AccessibleMangaReader-${{ matrix.arch }}/*"
          -DestinationPath "dist/AccessibleMangaReader-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AccessibleMangaReader-${{ matrix.arch }}
          path: |
            dist/AccessibleMangaReader-${{ matrix.arch }}.exe
            dist/AccessibleMangaReader-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
