name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python run_tests.py

      # Two builds from the same source.
      #   onefile: the familiar single .exe. It unpacks the whole bundle
      #            to a temp folder on every launch, which is why it is
      #            slow to start; kept because many people prefer one file.
      #   onedir:  a folder, zipped. Nothing is unpacked at launch, so it
      #            starts fast, and it avoids the self-extracting pattern
      #            that antivirus heuristics dislike.
      # --noupx: never UPX-compress. UPX slows startup and is a strong
      #          antivirus red flag.
      # --exclude-module tkinter: the app is wxPython only and never
      #          imports tkinter; PyInstaller would otherwise bundle it as
      #          dead weight. The interface is unaffected.
      - name: Build single executable
        run: >
          pyinstaller --onefile --windowed --clean --noupx
          --exclude-module tkinter
          --collect-all espeakng_loader
          --collect-all kokoro_onnx
          --collect-data language_tags
          --name AccessibleMangaReader-${{ matrix.arch }}
          main.py

      # Exercise the packaged native ONNX and eSpeak components without
      # downloading the 196 MB Kokoro model. Source imports do not catch a DLL
      # or language data file omitted by PyInstaller.
      - name: Test Kokoro runtime in packaged executable
        shell: pwsh
        run: |
          $report = "packaged-kokoro-self-test-${{ matrix.arch }}.json"
          $argument = "--kokoro-runtime-self-test=$report"
          $process = Start-Process `
            -FilePath "dist/AccessibleMangaReader-${{ matrix.arch }}.exe" `
            -ArgumentList $argument -WindowStyle Hidden -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          } else {
            throw "The packaged app did not create its Kokoro test report."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Kokoro runtime failed with exit code $($process.ExitCode)."
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) {
            throw "Packaged Kokoro runtime reported failure."
          }
          Remove-Item $report -Force

      # This must run after PyInstaller. Source tests cannot catch a
      # native PDFium component missing from the packaged executable.
      - name: Test PDF export in packaged executable
        shell: pwsh
        run: |
          $report = "packaged-pdf-self-test-${{ matrix.arch }}.json"
          $argument = "--pdf-export-self-test=$report"
          $process = Start-Process `
            -FilePath "dist/AccessibleMangaReader-${{ matrix.arch }}.exe" `
            -ArgumentList $argument -WindowStyle Hidden -Wait -PassThru
          if (Test-Path $report) {
            Get-Content $report
          } else {
            throw "The packaged app did not create its PDF test report."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged PDF export failed with exit code $($process.ExitCode)."
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) {
            throw "Packaged PDF export reported failure."
          }
          Remove-Item $report -Force
          Remove-Item "packaged-pdf-self-test-${{ matrix.arch }}.pdf" -Force

      # Same name as the exe, built to a separate path so the two do
      # not collide, then zipped to AccessibleMangaReader-<arch>.zip.
      - name: Build folder version
        run: >
          pyinstaller --onedir --windowed --clean --noupx
          --exclude-module tkinter
          --collect-all espeakng_loader
          --collect-all kokoro_onnx
          --collect-data language_tags
          --distpath dist-folder --workpath build-folder
          --name AccessibleMangaReader-${{ matrix.arch }}
          main.py

      # The folder version is kept and used on its own, often long
      # after any link to the project. The GPL asks that the licence
      # travel with the program, and eSpeak NG inside the build is
      # GPL too, so both notices go in beside the exe. The single
      # file build cannot carry companions; its About window names
      # them instead.
      - name: Add licence notices to the folder
        shell: pwsh
        run: |
          $folder = "dist-folder/AccessibleMangaReader-${{ matrix.arch }}"
          Copy-Item LICENSE -Destination $folder
          Copy-Item THIRD-PARTY-NOTICES.md -Destination $folder
          Get-Item "$folder/LICENSE", "$folder/THIRD-PARTY-NOTICES.md" |
            ForEach-Object { Write-Host "  included $($_.Name)" }

      - name: Zip folder version
        shell: pwsh
        run: >
          Compress-Archive
          -Path "dist-folder/AccessibleMangaReader-${{ matrix.arch }}/*"
          -DestinationPath "dist/AccessibleMangaReader-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AccessibleMangaReader-${{ matrix.arch }}
          path: |
            dist/AccessibleMangaReader-${{ matrix.arch }}.exe
            dist/AccessibleMangaReader-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
